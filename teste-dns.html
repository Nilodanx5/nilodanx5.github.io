<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DNS Local Tester</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .status-pending { color: #6b7280; }
        .status-success { color: #10b981; }
        .status-error { color: #ef4444; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 font-sans">
    <div class="max-w-2xl mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6">
        <h1 class="text-2xl font-bold text-gray-800 mb-4">DNS Local Tester</h1>
        <p class="text-gray-600 mb-6">Este mecanismo dispara requisições leves para 200 domínios para testar a resolução do seu DNS local.</p>
        
        <div class="flex gap-4 mb-6">
            <button id="startBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg transition">
                Iniciar Teste
            </button>
            <button id="resetBtn" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-6 rounded-lg transition">
                Resetar
            </button>
        </div>

        <div class="grid grid-cols-2 gap-4 mb-6">
            <div class="bg-blue-50 p-3 rounded-lg">
                <span class="block text-sm text-blue-600 font-semibold">Progresso</span>
                <span id="progressText" class="text-xl font-bold">0 / 200</span>
            </div>
            <div class="bg-green-50 p-3 rounded-lg">
                <span class="block text-sm text-green-600 font-semibold">Sucesso (Resolvido)</span>
                <span id="successCount" class="text-xl font-bold">0</span>
            </div>
        </div>

        <div id="results" class="border rounded-lg h-96 overflow-y-auto p-4 bg-gray-50 text-sm font-mono">
            <div class="text-gray-400 italic">Aguardando início...</div>
        </div>
    </div>

    <script>
        const domains = []; // Será preenchido via script
        let successCount = 0;
        let processedCount = 0;
        let isRunning = false;

        async function loadDomains() {
            const response = await fetch('domains.json');
            const data = await response.json();
            domains.push(...data);
        }

        async function testDNS(domain) {
            const startTime = performance.now();
            const resultDiv = document.createElement('div');
            resultDiv.className = 'mb-1';
            resultDiv.innerHTML = `<span class="text-gray-500">[...]</span> ${domain}`;
            document.getElementById('results').prepend(resultDiv);

            try {
                // Usamos no-cache e mode no-cors para apenas forçar a resolução DNS sem ser bloqueado por CORS
                // O fetch falhará se o DNS não resolver ou se o servidor estiver offline, mas o objetivo é o DNS.
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 3000);

                await fetch(`https://${domain}`, { 
                    mode: 'no-cors', 
                    cache: 'no-store',
                    signal: controller.signal 
                });
                
                clearTimeout(timeoutId);
                successCount++;
                resultDiv.innerHTML = `<span class="text-green-500">[OK]</span> ${domain} (${Math.round(performance.now() - startTime)}ms)`;
            } catch (e) {
                resultDiv.innerHTML = `<span class="text-red-500">[ERRO]</span> ${domain}`;
            }

            processedCount++;
            updateUI();
        }

        function updateUI() {
            document.getElementById('progressText').innerText = `${processedCount} / ${domains.length}`;
            document.getElementById('successCount').innerText = successCount;
        }

        document.getElementById('startBtn').addEventListener('click', async () => {
            if (isRunning) return;
            isRunning = true;
            document.getElementById('startBtn').disabled = true;
            document.getElementById('startBtn').classList.add('opacity-50');
            document.getElementById('results').innerHTML = '';
            
            // Disparar em lotes para não sobrecarregar o navegador, mas rápido o suficiente para o teste
            const batchSize = 5;
            for (let i = 0; i < domains.length; i += batchSize) {
                if (!isRunning) break;
                const batch = domains.slice(i, i + batchSize);
                await Promise.all(batch.map(domain => testDNS(domain)));
            }
            
            isRunning = false;
            document.getElementById('startBtn').disabled = false;
            document.getElementById('startBtn').classList.remove('opacity-50');
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            isRunning = false;
            processedCount = 0;
            successCount = 0;
            updateUI();
            document.getElementById('results').innerHTML = '<div class="text-gray-400 italic">Aguardando início...</div>';
            document.getElementById('startBtn').disabled = false;
            document.getElementById('startBtn').classList.remove('opacity-50');
        });

        loadDomains();
    </script>
</body>
</html>
